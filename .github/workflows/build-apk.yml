name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.linus .

      - name: Configure Android Audio Permissions and Service
        working-directory: mobile
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\"/>
          '''
          if 'FOREGROUND_SERVICE' not in content:
              content = content.replace('<application', perms + '\n    <application')

          if 'com.ryanheise.audioservice.AudioServiceActivity' not in content:
              content = content.replace('io.flutter.embedding.android.FlutterActivity', 'com.ryanheise.audioservice.AudioServiceActivity')

          service_def = '''
                  <service
                      android:name=\"com.ryanheise.audioservice.AudioService\"
                      android:foregroundServiceType=\"mediaPlayback\"
                      android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.media.browse.MediaBrowserService\" />
                      </intent-filter>
                  </service>
                  <receiver
                      android:name=\"androidx.media.session.MediaButtonReceiver\"
                      android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MEDIA_BUTTON\" />
                      </intent-filter>
                  </receiver>
          '''
          if 'com.ryanheise.audioservice.AudioService' not in content:
              content = content.replace('</application>', service_def + '\n    </application>')

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Successfully patched AndroidManifest.xml for AudioService!')
          "

      - name: Configure Android minSdk
        working-directory: mobile
        run: |
          python3 -c "
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          with open(gradle_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Ensured minSdk 21 in build.gradle!')
          "

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linus-music-player-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
